name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Verify and build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm test
          npm run check
          npm run build
          tar -czf ../aura-dashboard-release.tgz data dist dist-server ops package.json package-lock.json
      - name: Validate site scripts
        run: |
          node --check script.js
          node --check server/server.js
      - name: Configure verified SSH host
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Stage public website only
        run: |
          mkdir site-stage
          cp index.html article.html styles.css animations.css script.js site-stage/
          cp -r assets server deploy site-stage/
          printf '%s\n' "$GITHUB_SHA" > site-stage/revision.txt
      - name: Deploy site and news API
        run: |
          rsync -az --delete --exclude 'server/node_modules/' --exclude 'server/data/' --exclude '.env' site-stage/ "$VPS_USER@$VPS_HOST:/var/www/aurakingdom.online/"
          ssh "$VPS_USER@$VPS_HOST" 'cd /var/www/aurakingdom.online/server && npm ci --omit=dev && sudo /usr/bin/systemctl restart aurakingdom-api && systemctl is-active aurakingdom-api'
      - name: Deploy dashboard
        run: |
          scp aura-dashboard-release.tgz "$VPS_USER@$VPS_HOST:/tmp/aura-dashboard-release.tgz"
          ssh "$VPS_USER@$VPS_HOST" 'sudo /usr/local/sbin/aura-dashboard-deploy /tmp/aura-dashboard-release.tgz'
      - name: Verify production
        run: |
          curl --fail --retry 5 --retry-delay 3 https://aurakingdom.online/ops/api/health
          curl --fail --retry 5 --retry-delay 3 https://www.aurakingdom.online/ -o /tmp/live.html
          grep -q 'DOWNLOAD LAUNCHER' /tmp/live.html
          test "$(curl -fsS https://aurakingdom.online/revision.txt)" = "$GITHUB_SHA"
