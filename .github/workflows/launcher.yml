name: Build Windows launcher
on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish launcher/AuraLauncher.csproj -c Release -o package
      - name: Package assets
        shell: pwsh
        run: |
          Copy-Item launcher/logo.png,launcher/launcher.json,launcher/README-WPF.txt package/
          Invoke-WebRequest https://aurakingdom.online/updates/releases/launcher-4.1.0/AuraLauncher-4.1.0-WPF.zip -OutFile baseline.zip
          if ((Get-FileHash baseline.zip).Hash -ne '3C4DBBD37610589F0D7BF3881CEB5E1DCC3F9AFAFBA9783F6C9E4BA668E77006') { throw 'Baseline hash mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path baseline.zip))
          try { [IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry('launcher-bg.mp4'), (Join-Path (Resolve-Path package) 'launcher-bg.mp4')) } finally { $zip.Dispose() }
          Compress-Archive -Path package/* -DestinationPath AuraLauncher.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AuraLauncher-Windows
          path: AuraLauncher.zip
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: launcher-download-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AuraLauncher-Windows
      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Publish launcher atomically
        run: |
          sha256sum AuraLauncher.zip > AuraLauncher.zip.sha256
          scp AuraLauncher.zip "$VPS_USER@$VPS_HOST:/var/www/aura-launcher-download/AuraLauncher.pending.zip"
          scp AuraLauncher.zip.sha256 "$VPS_USER@$VPS_HOST:/var/www/aura-launcher-download/AuraLauncher.zip.sha256"
          ssh "$VPS_USER@$VPS_HOST" 'cd /var/www/aura-launcher-download && mv AuraLauncher.pending.zip AuraLauncher.zip && sha256sum -c AuraLauncher.zip.sha256'
          curl --fail --head https://aurakingdom.online/updates/launcher.zip
