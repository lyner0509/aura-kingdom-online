# Reference layout for aurakingdom.online.
#
# If Certbot already manages the live config (it does — the site serves
# HTTPS today), DO NOT copy this file over /etc/nginx/sites-available/.
# Instead install deploy/aurakingdom-locations.conf as a snippet and add
# one `include` line inside the existing server blocks. See deploy/SETUP.md.
#
# This file shows what the finished config looks like.

server {
    listen 80;
    listen [::]:80;
    server_name aurakingdom.online www.aurakingdom.online;

    # Certbot adds the redirect to HTTPS here.
    include snippets/aurakingdom-locations.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aurakingdom.online www.aurakingdom.online;

    # ssl_certificate / ssl_certificate_key are managed by Certbot.

    include snippets/aurakingdom-locations.conf;
}
