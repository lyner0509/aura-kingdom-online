# Shared location blocks for aurakingdom.online.
#
# Install as /etc/nginx/snippets/aurakingdom-locations.conf and pull it
# into the existing server block with:
#
#     include snippets/aurakingdom-locations.conf;
#
# Using a snippet means the TLS server block Certbot manages keeps
# working — nothing here overwrites it.

root /var/www/aurakingdom.online;
index index.html;

# --- The news API and the admin panel run on the Node service ---
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 8m;
}

location /admin {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Uploaded images live outside the web root, so a deploy that
#     mirrors the repo can never delete them ---
location ^~ /uploads/ {
    alias /var/lib/aurakingdom/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

# --- Every /news/<slug> URL is served by the same article page,
#     which fetches the dispatch from the API ---
location /news/ {
    try_files $uri /article.html;
}

# --- Caching: markup and code always fresh, art cached ---
location ~* \.(?:webp|png|jpg|jpeg|gif|svg|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

location ~* \.(?:html|css|js)$ {
    expires -1;
    add_header Cache-Control "no-cache";
}

location / {
    try_files $uri $uri/ =404;
}

# Never serve the server sources or git metadata as files.
location ~ ^/(server|deploy|\.git) {
    deny all;
    return 404;
}
